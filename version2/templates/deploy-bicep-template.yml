parameters:
  - name: appName
    type: string
  - name: environment
    type: string
  - name: azureServiceConnection
    type: string
  - name: resourceGroupName
    type: string
  - name: variableGroupName       # NEW
    type: string
  - name: dependsOn
    type: string                  # was object — now string
    default: ''
  
jobs:
  - deployment: Deploy_${{ parameters.appName }}_${{ parameters.environment }}
    displayName: 'Deploy ${{ parameters.appName }} - ${{ parameters.environment }}'
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    pool:
      vmImage: 'ubuntu-latest'

    # ${{ if ne(parameters.approvalEnvironment, '') }}:
    #   environment: ${{ parameters.approvalEnvironment  }}
    environment: ${{parameters.environment}}
    variables:
      - group: ${{ parameters.variableGroupName }}   
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
            - pwsh: |
                Write-Host "=== System.DefaultWorkingDirectory ==="
                Write-Host "$(System.DefaultWorkingDirectory)"
                
                Write-Host "`n=== Top-level contents ==="
                Get-ChildItem -Path "$(System.DefaultWorkingDirectory)" -Force | Format-Table Name, Mode
                
                Write-Host "`n=== Recursive listing (Depth 2) ==="
                Get-ChildItem -Path "$(System.DefaultWorkingDirectory)" -Recurse -Depth 2 -Force | Select-Object FullName
              displayName: 'Debug: Inspect working directory'
            - script: |
                APP_DIR="$(System.DefaultWorkingDirectory)/version2/apps/${{ parameters.appName }}/${{ parameters.environment }}"
                echo "Looking for: $APP_DIR"
                ls -la "$APP_DIR" || { echo "FATAL: $APP_DIR not found"; exit 1; }
              displayName: 'Verify folder exists'

            - task: AzureCLI@2
              displayName: 'Validate Bicep'
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -e
                  az bicep install
                  az bicep build \
                    --file "$(System.DefaultWorkingDirectory)/version2/apps/${{ parameters.appName }}/${{ parameters.environment }}/main.bicep"

            - task: AzureCLI@2
              displayName: 'What-If: ${{ parameters.appName }} / ${{ parameters.environment }}'
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  set -e
                  az deployment group what-if \
                    --resource-group ${{ parameters.resourceGroupName }} \
                    --template-file "$(System.DefaultWorkingDirectory)/version2/apps/${{ parameters.appName }}/${{ parameters.environment }}/main.bicep" \
                    --parameters "$(System.DefaultWorkingDirectory)/version2/apps/${{ parameters.appName }}/${{ parameters.environment }}/parameters.json"

            # - task: AzureCLI@2
            #   displayName: 'Deploy: ${{ parameters.appName }} / ${{ parameters.environment }}'
            #   inputs:
            #     azureSubscription: ${{ parameters.azureServiceConnection }}
            #     scriptType: 'bash'
            #     scriptLocation: 'inlineScript'
            #     inlineScript: |
            #       set -e
            #       az deployment group create \
            #         --resource-group ${{ parameters.resourceGroupName }} \
            #         --template-file "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.environment }}/main.bicep" \
            #         --parameters "$(System.DefaultWorkingDirectory)/${{ parameters.appName }}/${{ parameters.environment }}/parameters.json"
