parameters:
  - name: deployApp1
    displayName: 'Deploy App 1'
    type: boolean
    default: false
  - name: deployApp2
    displayName: 'Deploy App 2'
    type: boolean
    default: false

trigger:
  - none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: azureServiceConnection
    value: 'prod-azure-connection'
  - name: resourceGroupName
    value: 'az400'

stages:

  - stage: Summary
    displayName: 'Selection Summary'
    jobs:
      - job: PrintSelection
        displayName: 'Print selection'
        steps:
          - script: |
              echo "======================================"
              echo "  Multi-App Deployment Summary"
              echo "======================================"
              echo "App 1 selected : ${{ parameters.deployApp1 }}"
              echo "App 2 selected : ${{ parameters.deployApp2 }}"
              echo "Triggered by   : $(Build.Reason)"
              echo "Source branch  : $(Build.SourceBranch)"
              echo "======================================"
            displayName: 'Print selection'

    # ── App 1 ──────────────────────────────────────────────────
  - ${{ if eq(parameters.deployApp1, true) }}:
    - template: apps/app1/pipeline.yml
      parameters:
        dependsOnStage: 'Summary'

  # ── App 2 ──────────────────────────────────────────────────
  - ${{ if eq(parameters.deployApp2, true) }}:
    - template: apps/app2/pipeline.yml
      parameters:
        ${{ if eq(parameters.deployApp1, true) }}:
          dependsOnStage: 'App1'
        ${{ else }}:
          dependsOnStage: 'Summary'